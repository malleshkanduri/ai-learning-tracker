  const timeChip = (tm.start || tm.end)
    ? `<button class="tchip" data-act="time" title="Start / end time">${I.clock}${tm.start||'--:--'} → ${tm.end||'--:--'}${span?` <b>${fmtMin(span)}</b>`:''}</button>`
    : `<button class="tchip ghost" data-act="time" title="Set start / end time, or run a timer">${I.clock}Time</button>`;
  const running = state.timer && state.timer.key===keyOf(t);
  const runChip = running ? `<span class="trun"><i></i><b data-countdown>00:00</b></span>` : '';
  return `<div class="card ${st.cls}${selectedId===t.id?' sel':''}${running?' timing':''}" data-id="${t.id}" draggable="true"${stripe}>
    <div class="grip" title="Drag to reorder"></div>
    <button class="check" data-act="toggle" title="Mark done (D)">${I.check}</button>
    <div class="cbody">
      <textarea class="desc" rows="1" placeholder="Task description…">${esc(t.desc)}</textarea>
      <div class="crow">
        <select class="statussel" data-act="status">
          ${STATUSES.map(s=>`<option value="${s.id}"${s.id===t.status?' selected':''}>${s.label}</option>`).join('')}
        </select>
        <label class="hours"><input type="number" step="0.25" min="0" max="24" value="${t.hours||0}" data-act="hours" /><span>h</span></label>
        ${timeChip}${runChip}${tag}
      </div>
    </div>
    <button class="menubtn" data-act="menu" aria-expanded="false" title="More">${I.dots}</button>
  </div>`;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function listHTML(date){
  const list = visibleOn(date);
  if(!list.length){
    const filtered = state.filter!=='all' || state.search.trim();
    return `<div class="empty">${I.inbox}<p>${filtered?'No matching tasks':'Nothing logged yet'}</p></div>`;
  }
  return list.map(cardHTML).join('');
}

function colHTML(date, isDay){
  const d = dt(date);
  const tot = totalOn(date), done = totalDone(date);
  const cls = ['col']; if(isDay) cls.push('dayview'); if(date===TODAY) cls.push('istoday');
  const badge = tot>state.target ? 'over' : (tot>=state.target && tot>0 ? 'full' : '');
  return `<div class="${cls.join(' ')}" data-col="${date}">
    <div class="col-head">
      <div class="hmeta">
        <div class="dow">${dowOf(date)}${date===TODAY?' · Today':''}</div>
        <div class="dnum">${d.getDate()} ${MON3[d.getMonth()]}</div>
      </div>
      <div class="hbadge num ${badge}">${fmtH(tot)}</div>
    </div>
    <div class="qa">
      <div class="qa-plus">${I.plus}</div>
      <input type="text" data-add="${date}" placeholder="Add task…  try “Review PR 1.5h #prog”" />
    </div>
    <div class="list" data-list="${date}">${listHTML(date)}</div>
    <div class="col-foot"><span>Day total</span><b class="num">${fmtH(tot)} <span style="color:var(--text-3);font-weight:500">· ${fmtH(done)} done</span></b></div>
  </div>`;
}

function renderDay(){
  scroll.innerHTML = `<div class="cols">${colHTML(state.anchor,true)}</div>`;
  renderWeekbar();
}
function renderWeek(){
  scroll.innerHTML = `<div class="cols">${weekDays().map(d=>colHTML(d,false)).join('')}</div>`;
  renderWeekbar();
}
function renderWeekbar(){
  const days = weekDays();
  const tot = days.reduce((a,d)=>a+totalOn(d),0);
  const goal = state.target*5;
  const pct = goal? Math.min(100, tot/goal*100) : 0;
  weekbar.style.display='flex';
  weekbar.innerHTML =
    days.map(d=>`<div class="wb-item"><span>${dowOf(d)}</span><b class="num">${fmtH(totalOn(d))}</b></div>`).join('')
    + `<div class="wb-bar"><i style="width:${pct}%"></i></div>`
    + `<div class="wb-item tot" style="text-align:right"><span>Week total</span><b class="num">${fmtH(tot)} / ${goal}h</b></div>`;
}

function renderMonth(){
  const a = dt(state.anchor); a.setDate(1);
  const start = dt(monday(iso(a)));
  const weeks = Math.ceil(((a.getDay()+6)%7 + new Date(a.getFullYear(),a.getMonth()+1,0).getDate())/7);
  let h = DOW.map(d=>`<div class="m-dow">${d}</div>`).join('');
  for(let i=0;i<weeks*7;i++){
    const cur = new Date(start); cur.setDate(start.getDate()+i);
    const s = iso(cur);
    const list = visibleOn(s);
    const cls=['m-cell'];
    if(cur.getMonth()!==a.getMonth()) cls.push('out');
    if(isWeekend(s)) cls.push('we');
    if(s===TODAY) cls.push('today');
    const tot = totalOn(s);
    const shown = list.slice(0,3).map(t=>{
      const k = t.status==='done'?'d':t.status==='block'?'b':t.status==='prog'?'p':'';
      return `<div class="m-task ${k}" title="${esc(t.desc)}">${esc(t.desc)}</div>`;
    }).join('');
    h += `<div class="${cls.join(' ')}" data-goto="${s}">
      <div class="m-top"><b>${cur.getDate()}</b>${tot?`<em>${fmtH(tot)}</em>`:''}</div>
      ${shown}${list.length>3?`<div class="m-more">+${list.length-3} more</div>`:''}
    </div>`;
  }
  scroll.innerHTML = `<div class="month">${h}</div>`;
  weekbar.style.display='none';
}

/* ── summary panel ── */
function renderSummary(){
  if(state.view==='keep'){ renderBacklogSummary(); return; }
  const isDay = state.view==='day';
  const focus = isDay ? [state.anchor] : weekDays();
  const list  = focus.flatMap(d=>tasksOn(d));
  const tot   = list.reduce((a,t)=>a+(+t.hours||0),0);
  const goal  = isDay ? state.target : state.target*5;
  const pct   = goal ? Math.min(100, Math.round(tot/goal*100)) : 0;
  const R=39, C=2*Math.PI*R;
  const counts = STATUSES.map(s=>({...s, n:list.filter(t=>t.status===s.id).length}));
  const wdays = weekDays();
  const maxD = Math.max(state.target, ...wdays.map(totalOn));

  summary.innerHTML = `
    <h3>${isDay?'Day':'Week'} summary</h3>
    <div class="ring-wrap">
      <div class="ring">
        <svg width="88" height="88"><circle class="track" cx="44" cy="44" r="${R}"/>
        <circle class="prog" cx="44" cy="44" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C-(C*pct/100)}"/></svg>
        <div class="val"><b class="num">${pct}%</b><span>of goal</span></div>
      </div>
      <div class="ring-meta">
        <div class="big num">${fmtH(tot)} logged</div>
        <div class="sub">Target ${goal}h · ${tot>=goal?'goal met':fmtH(Math.max(0,goal-tot))+' to go'}</div>
        <div class="sub" style="margin-top:6px">${list.length} task${list.length===1?'':'s'} · ${list.filter(t=>t.status==='done').length} done</div>
      </div>
    </div>
    <h3>Breakdown</h3>
    <div class="chips">
      ${counts.map(c=>`<div class="chip"><i style="background:${c.color}"></i><span>${c.label}</span><b class="num">${c.n}</b></div>`).join('')}
    </div>
    <div class="divider"></div>
    <h3>Week at a glance</h3>
    <div class="wklist">
      ${wdays.map(d=>{
        const t = totalOn(d);
        return `<button class="wkrow ${d===state.anchor&&isDay?'on':''}" data-goto="${d}">
          <span>${dowOf(d)}</span><div class="mini"><i style="width:${maxD?Math.min(100,t/maxD*100):0}%"></i></div>
          <b class="num">${t?fmtH(t):'—'}</b></button>`;
      }).join('')}
    </div>
    <div class="divider"></div>
    <h3>Quick add syntax</h3>
    <div style="font-size:12.5px;color:var(--text-2);line-height:1.7">
      <kbd>2h</kbd> or <kbd>90m</kbd> sets time<br/>
      <kbd>#done</kbd> <kbd>#prog</kbd> <kbd>#block</kbd> sets status<br/>
      <span style="color:var(--text-3)">e.g. “Deploy Apigee proxy 2.5h #prog”</span>
    </div>`;
}

function renderBacklogSummary(){
  const items = state.keep || [];
  const done = items.filter(k=>k.status==='done').length;
  const pct = items.length ? Math.round(done/items.length*100) : 0;
  const R=39, C=2*Math.PI*R;
  const groups = {};
  items.forEach(k=>{ const c = categoryOf(k); const key = c ? c.name : 'Unassigned';
    groups[key] = groups[key] || {n:0, color: c ? c.color : 'var(--text-3)'}; groups[key].n++; });
  summary.innerHTML = `
    <h3>Learning backlog</h3>
    <div class="ring-wrap">
      <div class="ring">
        <svg width="88" height="88"><circle class="track" cx="44" cy="44" r="${R}"/>
        <circle class="prog" cx="44" cy="44" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C-(C*pct/100)}"/></svg>
        <div class="val"><b class="num">${pct}%</b><span>cleared</span></div>
      </div>
      <div class="ring-meta">
        <div class="big num">${items.length - done} open</div>
        <div class="sub">${done} of ${items.length} done</div>
      </div>
    </div>
    <h3>By category</h3>
    <div class="chips">${
      Object.keys(groups).length
        ? Object.entries(groups).map(([name,g])=>
            `<div class="chip"><i style="background:${g.color}"></i><span>${esc(name)}</span><b class="num">${g.n}</b></div>`).join('')
        : `<div class="chip"><span style="color:var(--text-3)">Nothing parked yet</span></div>`
    }</div>
    <div class="divider"></div>
    <h3>How it works</h3>
    <div style="font-size:12.5px;color:var(--text-2);line-height:1.7">
      Items here live in the <b>Learning Backlog</b> sheet, separate from the daily log.<br/>
      Use <b>To today</b> to pull one into today's work, or a task's <b>⋯</b> menu to park it here.
    </div>`;
}

function autosize(el){ el.style.height='auto'; el.style.height=(el.scrollHeight)+'px'; }
new MutationObserver(()=>{ document.querySelectorAll('.desc').forEach(autosize); })
  .observe(scroll,{childList:true,subtree:true});

   EVENTS — CANVAS
   ══════════════════════════════════════════════════════════ */
scroll.addEventListener('click', e=>{
  const krow = e.target.closest('[data-keep]');
  if(krow){
    const id = krow.dataset.keep;
    const act = e.target.closest('[data-kact]');
    if(act){
      const k = act.dataset.kact;
      if(k==='toggle'){
        const item = state.keep.find(x=>x.id===id);
        patchBacklog(id,{status: item.status==='done'?'open':'done'}); render(); return;
      }
      if(k==='today'){ keepToToday(id); render(); toast('Moved to today', undo); return; }
      if(k==='del'){ removeBacklog(id); render(); toast('Removed from Backlog', undo); return; }
    }
    return;
  }
  const goto = e.target.closest('[data-goto]');
  if(goto){ state.anchor = goto.dataset.goto; state.calAnchor = state.anchor; state.view='day'; save(); render(); return; }
  const card = e.target.closest('.card'); if(!card) return;
  const id = card.dataset.id;
  const act = e.target.closest('[data-act]');
  if(act && act.dataset.act==='toggle'){
    const t = state.tasks.find(x=>x.id===id);
    patch(id,{status: t.status==='done'?'open':'done'});
    render(); return;
  }
  if(act && act.dataset.act==='menu'){ openCardMenu(act, id); return; }
  if(act && act.dataset.act==='time'){ openTimePopover(act, id); return; }
  selectedId = id;
  document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'));
  card.classList.add('sel');
});

scroll.addEventListener('change', e=>{
  const card = e.target.closest('.card'); if(!card) return;
  const id = card.dataset.id, act = e.target.dataset.act;
  if(act==='status'){ patch(id,{status:e.target.value}); render(); }
  if(act==='hours'){ patch(id,{hours: Math.max(0, parseFloat(e.target.value)||0)}); render(); }
});

scroll.addEventListener('input', e=>{
  if(e.target.matches('[data-add], .desc')){
    renderProjectSuggest(e.target);
  }
  if(e.target.matches('[data-add]')){
    return;
  }
  const krow = e.target.closest('[data-keep]');
  if(krow){
    const id = krow.dataset.keep, act = e.target.dataset.kact;
    if(act==='desc'){ autosize(e.target); const k=state.keep.find(x=>x.id===id); if(k){ k.desc=e.target.value; save(); } }
    if(act==='note'){ const k=state.keep.find(x=>x.id===id); if(k){ k.note=e.target.value; save(); } }
    return;
  }
  if(e.target.classList.contains('desc')){
    autosize(e.target);
    const id = e.target.closest('.card').dataset.id;
    const t = state.tasks.find(x=>x.id===id);
    if(t){ moveTimes(t.date, t.desc, t.date, e.target.value); }
    patch(id,{desc:e.target.value}, false);
  }
});
scroll.addEventListener('click', e=>{
  const pick = e.target.closest('[data-project-pick]');
  if(pick){
    const host = pick.closest('.qa,.card');
    const input = host.querySelector('[data-add], .desc');
    selectProjectSuggestion(input, pick.dataset.projectPick);
    return;
  }
  const clear = e.target.closest('[data-clear-project]');
  if(clear){
    const host = clear.closest('.qa');
    delete host.querySelector('[data-add]').dataset.selectedProject;
    clear.closest('.qa-project-chip').remove();
  }
});
scroll.addEventListener('focusin', e=>{
  if(e.target.classList.contains('desc')){ snapshot(); selectedId = e.target.closest('.card').dataset.id; }
});
scroll.addEventListener('focusout', e=>{
  if(e.target.classList.contains('desc')){
    const id = e.target.closest('.card').dataset.id;
    const t = state.tasks.find(x=>x.id===id);
    if(t && !t.desc.trim()){ removeTask(id); render(); }
    else { renderSummary(); renderWeekbar(); }
  }
});

/* quick add */
scroll.addEventListener('keydown', e=>{
  const projectInput = e.target.closest('[data-add], .card .desc');
  if(projectInput){
    const menu = projectInput.closest('.qa,.card')?.querySelector('.qa-suggest');
    if(menu && (e.key==='ArrowDown' || e.key==='ArrowUp')){
      e.preventDefault();
      const options = [...menu.querySelectorAll('[data-project-pick]')];
      const active = Number(menu.dataset.active||0);
      const next = (active + (e.key==='ArrowDown'?1:-1) + options.length) % options.length;
      menu.dataset.active = String(next);
      options.forEach((option,index)=>{
        option.classList.toggle('active', index===next);
        option.setAttribute('aria-selected', String(index===next));
      });
      return;
    }
    if(menu && e.key==='Enter'){
      e.preventDefault();
      const options = [...menu.querySelectorAll('[data-project-pick]')];
      const chosen = options[Number(menu.dataset.active||0)] || options[0];
      if(chosen) selectProjectSuggestion(projectInput, chosen.dataset.projectPick);
      return;
    }
    if(menu && e.key==='Escape'){
      e.preventDefault();
      closeProjectSuggest(projectInput);
      return;
    }
  }
  const keepAdd = e.target.closest('[data-keepadd]');
  if(keepAdd && e.key==='Enter'){
    e.preventDefault();
    if(addBacklog(keepAdd.value)){ keepAdd.value=''; render();
      const again = document.querySelector('[data-keepadd]'); if(again) again.focus(); }
    return;
  }
  const input = e.target.closest('[data-add]');
  if(input && e.key==='Enter'){
    e.preventDefault();
    const project = input.dataset.selectedProject || '';
    const t = addTask(input.dataset.add, input.value, project);
    if(t){ input.value=''; delete input.dataset.selectedProject; selectedId=t.id; const d=input.dataset.add; render();
      const node = document.querySelector(`.card[data-id="${t.id}"]`);
      if(node){ node.classList.add('flash'); node.scrollIntoView({block:'nearest'}); }
      const again = document.querySelector(`[data-add="${d}"]`); if(again) again.focus();
    }
    return;
  }
  if(e.target.classList.contains('desc')){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); e.target.blur(); }
    if(e.key==='Escape'){ e.target.blur(); }
  }
});

/* ══════════════════════════════════════════════════════════
   DRAG & DROP
   ══════════════════════════════════════════════════════════ */
scroll.addEventListener('dragstart', e=>{
  const card = e.target.closest('.card'); if(!card) return;
  dragId = card.dataset.id;
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain', dragId); }catch(_){}
});
scroll.addEventListener('dragend', ()=>{
  dragId=null;
  document.querySelectorAll('.dragging').forEach(n=>n.classList.remove('dragging'));
  document.querySelectorAll('.drop-ind').forEach(n=>n.remove());
  document.querySelectorAll('.dragover').forEach(n=>n.classList.remove('dragover'));
});
scroll.addEventListener('dragover', e=>{
  const list = e.target.closest('[data-list]'); if(!list || !dragId) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.drop-ind').forEach(n=>n.remove());
  document.querySelectorAll('.col.dragover').forEach(n=>n.classList.remove('dragover'));
  list.closest('.col').classList.add('dragover');
  const ind = document.createElement('div'); ind.className='drop-ind';
  const after = afterElement(list, e.clientY);
  if(after) list.insertBefore(ind, after); else list.appendChild(ind);
});
scroll.addEventListener('drop', e=>{
  const list = e.target.closest('[data-list]'); if(!list || !dragId) return;
  e.preventDefault();
  const date = list.dataset.list;
  const cards = [...list.querySelectorAll('.card:not(.dragging)')];
  const after = afterElement(list, e.clientY);
  const index = after ? cards.indexOf(after) : cards.length;
  moveTask(dragId, date, index<0?cards.length:index);
  dragId=null; render();
});
function afterElement(list, y){
  const els = [...list.querySelectorAll('.card:not(.dragging)')];
  return els.reduce((best,el)=>{
    const b = el.getBoundingClientRect();
    const off = y - b.top - b.height/2;
    return (off<0 && off>best.off) ? {off,el} : best;
  },{off:-Infinity,el:null}).el;
}

let openMenu=null;
function closeMenu(){ if(openMenu){ openMenu.remove(); openMenu=null; }
  document.querySelectorAll('[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false')); }
document.addEventListener('click', e=>{
  if(openMenu && !e.target.closest('.menu') && !e.target.closest('.tpop') && !e.target.closest('.pop') &&
     !e.target.closest('[data-act="menu"]') && !e.target.closest('[data-act="time"]') &&
  !e.target.closest('#quickBtn') && !e.target.closest('#periodLabel') &&
  !e.target.closest('#moreBtn') && !e.target.closest('.qa-suggest')) closeMenu();
});
window.addEventListener('resize', closeMenu);
scroll.addEventListener('scroll', closeMenu);

const PRESETS = [15, 25, 30, 45, 60, 90];
function openTimePopover(btn, id){
  closeMenu();
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  const tm = getTimes(t);
  const running = state.timer && state.timer.key===keyOf(t);
  const fromHours = Math.round((+t.hours||0)*60);
  const span = (tm.start && tm.end) ? minsBetween(tm.start, tm.end) : 0;

  const pop = document.createElement('div'); pop.className='tpop';
  pop.innerHTML = `
    <h4>Start &amp; end time</h4>
    <div class="trow"><label>Start</label>
      <input type="time" data-tf="start" value="${tm.start||''}" />
      <button class="now" data-tf="nowStart">Now</button></div>
    <div class="trow"><label>End</label>
      <input type="time" data-tf="end" value="${tm.end||''}" />
      <button class="now" data-tf="nowEnd">Now</button></div>
    <div class="dur"><span>Duration</span><b data-tf="dur">${span?fmtMin(span):'—'}</b></div>
    ${span?`<button class="now" data-tf="apply" style="width:100%;height:30px">Set task hours to ${(Math.round(span/60*100)/100)}h</button>`:''}
    <hr/>
    <h4>${running?'Timer running':'Run a timer'}</h4>
    ${running ? '' : `<div class="mins" data-tf="mins">
        ${fromHours>0?`<button data-min="${fromHours}" class="on">${fmtMin(fromHours)} (task)</button>`:''}
        ${PRESETS.map(m=>`<button data-min="${m}"${(!fromHours&&m===25)?' class="on"':''}>${m}m</button>`).join('')}
      </div>`}
    ${running
      ? `<button class="go stop" data-tf="stop">${I.stop}Stop timer</button>`
      : `<button class="go" data-tf="start">${I.play}Start timer</button>`}
    <p style="margin:10px 0 0;font-size:11.5px;color:var(--text-3);line-height:1.5">
      Times and timers stay in the app — they are never written to the workbook.</p>`;

  document.body.appendChild(pop);
  const b = btn.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(b.left-60, window.innerWidth-300))+'px';
  pop.style.top  = Math.max(8, Math.min(b.bottom+8, window.innerHeight-pop.offsetHeight-12))+'px';
  openMenu = pop;

  const refresh = ()=>{
    const s = pop.querySelector('[data-tf="start"]').value;
    const e = pop.querySelector('[data-tf="end"]').value;
    const d = (s&&e) ? minsBetween(s,e) : 0;
    pop.querySelector('[data-tf="dur"]').textContent = d ? fmtMin(d) : '—';
  };
  pop.addEventListener('change', ev=>{
    const f = ev.target.dataset.tf;
    if(f==='start' || f==='end'){ setTimes(t, {[f]: ev.target.value}); refresh(); renderCurrentLists(); }
  });
  pop.addEventListener('click', ev=>{
    const el = ev.target.closest('[data-min]');
    if(el){ pop.querySelectorAll('[data-min]').forEach(x=>x.classList.remove('on'));
      el.classList.add('on'); return; }
    const f = (ev.target.closest('[data-tf]')||{}).dataset;
    if(!f || !f.tf) return;
    if(f.tf==='nowStart'){ const v=nowHM();
      pop.querySelector('[data-tf="start"]').value=v; setTimes(t,{start:v}); refresh(); renderCurrentLists(); }
    if(f.tf==='nowEnd'){ const v=nowHM();
      pop.querySelector('[data-tf="end"]').value=v; setTimes(t,{end:v}); refresh(); renderCurrentLists(); }
    if(f.tf==='apply'){
      const s=pop.querySelector('[data-tf="start"]').value, e=pop.querySelector('[data-tf="end"]').value;
      patch(t.id,{hours: Math.round(minsBetween(s,e)/60*100)/100});

  });

}

  if(state.view==='keep') return;

/* ══════════════════════════════════════════════════════════
   KEYBOARD
   ══════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); save(); toast('Progress saved'); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if(e.key==='Escape'){ closeMenu(); $('#overlay').classList.remove('on');
    if(document.activeElement===$('#searchInput')){ $('#searchInput').value=''; state.search=''; render(); $('#searchInput').blur(); }
    return; }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); $('#searchInput').focus(); return; }
  if(e.key==='?'){ showHelp(); return; }
  if(e.key==='ArrowLeft'){ step(-1); return; }
  if(e.key==='ArrowRight'){ step(1); return; }
  const k = e.key.toLowerCase();
  if(k==='t'){ state.anchor=TODAY; state.calAnchor=TODAY; save(); render(); return; }
  if(k==='1'){ state.view='day'; save(); render(); return; }
  if(k==='2'){ state.view='week'; save(); render(); return; }
  if(k==='3'){ state.view='month'; save(); render(); return; }
  if(k==='4'){ state.view='keep'; save(); render(); return; }
  if(k==='n'){ e.preventDefault();
    if(state.view==='keep'){ const kb=document.querySelector('[data-keepadd]'); if(kb) kb.focus(); return; }
    const inp = document.querySelector(`[data-add="${state.view==='day'?state.anchor:(document.querySelector('.col.istoday')?TODAY:weekDays()[0])}"]`)
             || document.querySelector('[data-add]');
    if(inp) inp.focus(); return; }
  if(!selectedId) return;
  const t = state.tasks.find(x=>x.id===selectedId); if(!t) return;
  if(k==='d'){ patch(selectedId,{status:t.status==='done'?'open':'done'}); render(); return; }
  if(e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); removeTask(selectedId); selectedId=null; render(); toast('Task deleted', undo); return; }
  if(e.altKey && (e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();
    const sibs = tasksOn(t.date), i = sibs.findIndex(x=>x.id===selectedId);
    if(e.key==='ArrowUp' && i>0) moveTask(selectedId,t.date,i-1);
    if(e.key==='ArrowDown' && i<sibs.length-1) moveTask(selectedId,t.date,i+2);
    render();
  }
});

/* ══════════════════════════════════════════════════════════
   XLSX WRITER  (pure JS — ZIP/STORE + OOXML, no libraries)
   ══════════════════════════════════════════════════════════ */
const CRC_T=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}

function zip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
  const now=new Date();
  const dosTime=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF;
  const dosDate=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  for(const f of files){
    const name=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array(30+name.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,0,true); lv.setUint16(10,dosTime,true); lv.setUint16(12,dosDate,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,name.length,true); lv.setUint16(28,0,true);
    lh.set(name,30); parts.push(lh,data);
    const ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,dosTime,true); cv.setUint16(14,dosDate,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint32(42,offset,true);
    ch.set(name,46); central.push(ch);
    offset += lh.length + data.length;
  }
  const cdSize = central.reduce((a,b)=>a+b.length,0);
  const eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  const all=[...parts,...central,eo];
  const out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));
  let p=0; for(const c of all){ out.set(c,p); p+=c.length; }
  return out;
}
const U8 = s => new TextEncoder().encode(s);

const SX = { dateN:5, dateO:6, dateD:7, txtN:2, txtO:3, txtD:4, numN:8, numO:9, numD:10, totT:11, totN:12, head:1 };
function stylesFor(status){
  const d = status==='done';
  return { date: d?SX.dateD:SX.dateO, txt: d?SX.txtD:SX.txtO, num: d?SX.numD:SX.numO };
}
const cS = (ref,s,v) => (v===''||v==null) ? `<c r="${ref}" s="${s}"/>`
  : `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
const cN = (ref,s,v) => `<c r="${ref}" s="${s}"><v>${v}</v></c>`;

function buildSheet(monthKey){
  const [Y,M] = monthKey.split('-').map(Number);
  const first = new Date(Y, M-1, 1), last = new Date(Y, M, 0);
  let rows = [], r = 1;
  const H = ['Date','Task Description','Status','Time','Day Total'];
  rows.push(`<row r="1" ht="22" customHeight="1">${H.map((h,i)=>cS(String.fromCharCode(65+i)+'1',SX.head,h)).join('')}</row>`);
  r = 2;
  let monthTotal = 0;
  let cur = dt(monday(iso(first)));
  while(cur <= last){
    const wkStart = iso(cur);
    let weekTotal = 0, wrote = false;
    for(let i=0;i<7;i++){
      const day = addDays(wkStart, i);
      const d = dt(day);
      if(d < first || d > last) continue;
      const list = tasksOn(day);
      if(!list.length && isWeekend(day)) continue;
      const dayTot = totalOn(day);
      weekTotal += dayTot; monthTotal += dayTot; wrote = true;
      if(!list.length){
        rows.push(`<row r="${r}">${cN('A'+r,SX.dateN,xserial(day))}${cS('B'+r,SX.txtN,'')}${cS('C'+r,SX.txtN,'')}${cS('D'+r,SX.numN,'')}${cN('E'+r,SX.numN,0)}</row>`);
        r++;
      } else {
        list.forEach((t,idx)=>{
          const st = stylesFor(t.status);
          rows.push(`<row r="${r}">`
            + (idx===0 ? cN('A'+r,st.date,xserial(day)) : cS('A'+r,st.date,''))
            + cS('B'+r,st.txt,t.desc)
            + cS('C'+r,st.txt,S(t.status).label)
            + cN('D'+r,st.num,(+t.hours||0))
            + (idx===0 ? cN('E'+r,SX.numN,dayTot) : cS('E'+r,SX.numN,''))
            + `</row>`);
          r++;
        });
      }
    }
    if(wrote){
      r++; // blank separator row
      rows.push(`<row r="${r}" ht="20" customHeight="1">`
        + cS('A'+r,SX.totT,'') + cS('B'+r,SX.totT,'Week total  ('+pretty(wkStart).replace(/^\w+, /,'')+' →)')
        + cS('C'+r,SX.totT,'') + cN('D'+r,SX.totN,Math.round(weekTotal*100)/100) + cS('E'+r,SX.totT,'')
        + `</row>`);
      r += 2;
    }
    cur.setDate(cur.getDate()+7);
  }
  rows.push(`<row r="${r}" ht="22" customHeight="1">`
    + cS('A'+r,SX.totT,'') + cS('B'+r,SX.totT,'MONTH TOTAL')
    + cS('C'+r,SX.totT,'') + cN('D'+r,SX.totN,Math.round(monthTotal*100)/100) + cS('E'+r,SX.totT,'')
    + `</row>`);

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView showGridLines="0" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="16"/>
<cols><col min="1" max="1" width="19" customWidth="1"/><col min="2" max="2" width="56" customWidth="1"/><col min="3" max="3" width="14" customWidth="1"/><col min="4" max="4" width="11" customWidth="1"/><col min="5" max="5" width="12" customWidth="1"/></cols>
<sheetData>${rows.join('')}</sheetData>
<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>
</worksheet>`;
}

function buildWorkbook(){
  let months = [...new Set(state.tasks.map(t=>t.date.slice(0,7)))].sort();
  if(!months.length) months = [state.anchor.slice(0,7)];
  const names = months.map(m=>{ const [y,mm]=m.split('-'); return MON3[+mm-1]+' '+y; });
  const files = [];
  files.push({name:'[Content_Types].xml', data:U8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${months.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`)});
  files.push({name:'_rels/.rels', data:U8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`)});
  files.push({name:'xl/workbook.xml', data:U8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${names.map((n,i)=>`<sheet name="${esc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>
</workbook>`)});
  files.push({name:'xl/_rels/workbook.xml.rels', data:U8(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${months.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
<Relationship Id="rId${months.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`)});
  files.push({name:'xl/styles.xml', data:U8(STYLES)});
  months.forEach((m,i)=> files.push({name:`xl/worksheets/sheet${i+1}.xml`, data:U8(buildSheet(m))}));
  return zip(files);
}

async function exportExcel(){
  let bytes;
  try{ bytes = buildWorkbook(); }
  catch(err){ toast('Export failed: '+err.message); return; }
  const name = 'TaskTracker-'+state.anchor.slice(0,7)+'.xlsx';
  const mime = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle){
        fileHandle = await window.showSaveFilePicker({
          suggestedName: name,
          types:[{description:'Excel Workbook', accept:{[mime]:['.xlsx']}}]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(bytes); await w.close();
      toast('Saved to '+fileHandle.name);
      return;
    }catch(err){
      if(err && err.name==='AbortError') return;
      fileHandle = null;
    }
  }
  download(bytes, name, mime);
  toast('Excel file downloaded');
}

  ensureLearningEstimates(); state.view=k;
  const items=learningList(k);
  scroll.innerHTML=`<div class="keep"><div class="keep-head"><div><h2>${statusTitle(k)}</h2><p>${items.length} learning topic${items.length===1?'':'s'} · click a Pluralsight title to open the course</p></div></div><div class="keep-card"><div class="keep-list">${items.length?items.map(cardHTML).join(''):`<div class="empty">${I.inbox}<p>No topics here</p></div>`}</div></div></div>`;
  weekbar.style.display='none';
}
const _boardRender=render;
render=function(){
  ensureLearningEstimates();
  if(['todo','prog','done'].includes(state.view)){
    document.documentElement.setAttribute('data-theme',state.theme); $('#themeBtn').innerHTML=state.theme==='light'?I.moon:I.sun;
    [...$('#viewSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.view===state.view));
    $('#periodLabel').innerHTML=`AI Learning Tracker<small>10 hours/week · beginner plan</small>`;
    renderToolbar(); renderLearningBoard(state.view); renderSummary(); return;
  }
  state.view='todo'; render();
};
const _learningCard=cardHTML;
cardHTML=function(t){
  let h=_learningCard(t); if(!t.learning)return h;
  const est=t.learning.estimatedHours||5;
  h=h.replace(/<label class="hours">[\s\S]*?<\/label>/,`<span class="tag">Est. ${est}h</span>`);
  h=h.replace('>Open</option>','>To Do</option>').replace('>Done</option>','>Completed</option>').replace(/<option value="block"[^>]*>Blocked<\/option>/,'');
  return h;
};
renderSummary=function(){
  ensureLearningEstimates();
  const learning=state.tasks.filter(t=>t.learning), done=learning.filter(t=>learningStatus(t)==='done'), prog=learning.filter(t=>learningStatus(t)==='prog'), todo=learning.filter(t=>learningStatus(t)==='todo');
  const totalH=learning.reduce((a,t)=>a+(t.learning.estimatedHours||0),0), doneH=done.reduce((a,t)=>a+(t.learning.estimatedHours||0),0), pct=learning.length?Math.round(done.length/learning.length*100):0;
  const weeks=Math.ceil((totalH-doneH)/10);
  const modules={}; learning.forEach(t=>{const k=t.learning.module;modules[k]=modules[k]||[0,0];modules[k][0]++;if(learningStatus(t)==='done')modules[k][1]++;});
  summary.innerHTML=`<h3>Learning progress</h3><div class="ring-wrap"><div class="ring"><svg width="88" height="88"><circle class="track" cx="44" cy="44" r="39"/><circle class="prog" cx="44" cy="44" r="39" stroke-dasharray="245" stroke-dashoffset="${245-(245*pct/100)}"/></svg><div class="val"><b>${pct}%</b><span>complete</span></div></div><div class="ring-meta"><div class="big">${done.length} of ${learning.length} topics</div><div class="sub">~${totalH} beginner hours total</div><div class="sub">~${weeks} weeks remaining at 10h/week</div></div></div>
  <h3>Status</h3><div class="chips"><button class="chip" data-jump-status="todo"><i style="background:var(--open)"></i><span>To Do</span><b>${todo.length}</b></button><button class="chip" data-jump-status="prog"><i style="background:var(--prog)"></i><span>In Progress</span><b>${prog.length}</b></button><button class="chip" data-jump-status="done"><i style="background:var(--done)"></i><span>Completed</span><b>${done.length}</b></button></div><div class="divider"></div><h3>Modules · click to open</h3><div class="wklist">${Object.entries(modules).map(([k,v])=>`<button class="wkrow" data-jump-module="${esc(k)}"><span style="width:auto;flex:1">${esc(k)}</span><b>${Math.round(v[1]/v[0]*100)}%</b></button>`).join('')}</div>`;
};
summary.addEventListener('click',e=>{
  const s=e.target.closest('[data-jump-status]'); if(s){state.view=s.dataset.jumpStatus;save();render();return;}
  const m=e.target.closest('[data-jump-module]'); if(m){
    const name=m.dataset.jumpModule; const t=state.tasks.find(x=>x.learning&&x.learning.module===name&&learningStatus(x)!=='done')||state.tasks.find(x=>x.learning&&x.learning.module===name); if(!t)return;
    state.view=learningStatus(t); state.search=''; save(); render(); setTimeout(()=>{const c=document.querySelector(`.card[data-id="${t.id}"]`);if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.classList.add('flash');}},50);
  }
});
// Status-board controls replace date navigation.
$('#prev').style.display='none'; $('#next').style.display='none'; $('#todayBtn').style.display='none';

// Restore a JSON backup exported from this application.
$('#fileInput').addEventListener('change', async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  try{const data=JSON.parse(await f.text()); const incoming=data.state||data; Object.assign(state,incoming); normalise(); ensureLearningEstimates(); save(); render(); toast('Progress restored');}
  catch(_){toast('Could not restore that backup');}
  e.target.value='';
});

/* ══════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════ */
async function boot(){
  load();
  seedLearningCurriculum();
  const remote=await loadFromGitHub();
  if(remote) normalise();
  ensureLearningEstimates();
  render();
  setAutosaveText(remote?'Loaded from GitHub':(githubConfig().owner?'Saved locally · GitHub token needed':'Saved locally'));
  setTimeout(()=>{ document.querySelectorAll('.desc').forEach(autosize); },0);
  tickTimers();
}

let booted = false;
const startup = ()=>{ if(booted) return; booted = true; boot(); };
startup();

document.addEventListener('visibilitychange', ()=>{ if(document.hidden) scheduleGitHubSave(); });

})();
</script>
</body>
</html>
